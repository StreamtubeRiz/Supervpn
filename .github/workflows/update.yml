name: Auto Update VPN Servers

on:
  schedule:
    - cron: '0 * * * *' # Har 1 ghante baad khud chalega
  workflow_dispatch:    # Manual button se chalane ke liye

permissions:
  contents: write

jobs:
  update-servers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python Script
        run: python3 fetch.py

      - name: Commit and Push servers.json
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"
          git add servers.json
          git commit -m "Auto update servers list" || exit 0
          git push
          
